<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Wavelength — Live Scratchpad</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap');

  :root{
    --bg: #12141a;
    --surface: #1b1e27;
    --surface-2: #22252f;
    --line: #2c3040;
    --ink: #e8b959;
    --ink-dim: #a88643;
    --live: #5eead4;
    --text: #e8e6e1;
    --muted: #8a8f9c;
    --danger: #e88a8a;
    --radius: 14px;
  }

  *{ box-sizing: border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    background:
      radial-gradient(1200px 600px at 15% -10%, rgba(232,185,89,0.06), transparent 60%),
      radial-gradient(1000px 500px at 100% 110%, rgba(94,234,212,0.05), transparent 60%),
      var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height:100%;
    display:flex;
    flex-direction:column;
  }

  h1,h2,h3, .display{ font-family:'Fraunces', serif; font-weight:600; letter-spacing:-0.01em; }

  ::selection{ background: rgba(232,185,89,0.25); }

  button{ font-family:'Inter', sans-serif; cursor:pointer; }

  /* ---------- App shell ---------- */
  #app{ flex:1; display:flex; flex-direction:column; }

  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding: 16px 22px;
    border-bottom: 1px solid var(--line);
    background: rgba(27,30,39,0.6);
    backdrop-filter: blur(10px);
  }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand-mark{
    width:26px; height:26px; border-radius:7px;
    background: linear-gradient(150deg, var(--ink), var(--ink-dim));
    box-shadow: 0 0 0 1px rgba(0,0,0,0.2) inset, 0 2px 10px rgba(232,185,89,0.25);
    position:relative; flex-shrink:0;
  }
  .brand-mark::after{
    content:''; position:absolute; inset:6px;
    border-radius:3px; background: var(--bg);
  }
  .brand-name{ font-size:15px; letter-spacing:0.02em; color:var(--text); }
  .brand-name b{ color: var(--ink); }

  .status-pill{
    display:flex; align-items:center; gap:8px;
    font-size:12px; color:var(--muted);
    padding:6px 12px; border:1px solid var(--line); border-radius:999px;
    background: var(--surface);
  }
  .dot{
    width:7px; height:7px; border-radius:50%;
    background: var(--muted);
  }
  .dot.live{ background: var(--live); box-shadow:0 0 0 0 rgba(94,234,212,0.6); animation: pulse 2s infinite; }
  @keyframes pulse{
    0%{ box-shadow:0 0 0 0 rgba(94,234,212,0.45); }
    70%{ box-shadow:0 0 0 8px rgba(94,234,212,0); }
    100%{ box-shadow:0 0 0 0 rgba(94,234,212,0); }
  }

  /* ---------- Landing / tuner screen ---------- */
  .center-stage{
    flex:1; display:flex; align-items:center; justify-content:center;
    padding: 32px 18px;
  }
  .tuner-card{
    width:100%; max-width: 420px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 36px 30px 30px;
    box-shadow: 0 30px 60px -25px rgba(0,0,0,0.6);
  }
  .eyebrow{
    font-size:11px; text-transform:uppercase; letter-spacing:0.16em;
    color: var(--ink-dim); margin-bottom:8px; font-weight:600;
  }
  .tuner-card h1{ font-size:26px; margin:0 0 6px; }
  .tuner-card p.sub{ color:var(--muted); font-size:14px; margin:0 0 28px; line-height:1.5; }

  .code-row{
    display:flex; gap:10px; justify-content:center; margin-bottom:26px;
  }
  .code-digit{
    width:56px; height:66px;
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 10px;
    text-align:center;
    font-family:'JetBrains Mono', monospace;
    font-size:28px; font-weight:700;
    color: var(--ink);
    outline:none;
    transition: border-color .15s, box-shadow .15s, transform .1s;
    caret-color: var(--ink);
  }
  .code-digit:focus{
    border-color: var(--ink);
    box-shadow: 0 0 0 3px rgba(232,185,89,0.15);
    transform: translateY(-1px);
  }

  .role-row{ display:flex; flex-direction:column; gap:10px; }
  .role-btn{
    display:flex; align-items:center; gap:12px;
    padding:14px 16px;
    border-radius: 12px;
    border:1px solid var(--line);
    background: var(--surface-2);
    color: var(--text);
    text-align:left;
    transition: border-color .15s, background .15s, transform .1s;
  }
  .role-btn:hover{ border-color: var(--ink-dim); transform: translateY(-1px); }
  .role-btn:disabled{ opacity:0.4; cursor:not-allowed; transform:none; }
  .role-icon{
    width:34px; height:34px; border-radius:9px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    font-size:16px;
    background: rgba(232,185,89,0.1); color: var(--ink);
  }
  .role-btn.viewer .role-icon{ background: rgba(94,234,212,0.1); color: var(--live); }
  .role-title{ font-weight:600; font-size:14px; }
  .role-desc{ font-size:12px; color:var(--muted); margin-top:2px; }

  .hint{
    margin-top:20px; font-size:12px; color: var(--muted); text-align:center;
  }

  /* ---------- Workspace ---------- */
  .workspace{ display:none; flex:1; flex-direction:column; }
  .workspace.active{ display:flex; }

  .toolbar{
    display:flex; align-items:center; gap:12px; flex-wrap:wrap;
    padding: 12px 22px; border-bottom:1px solid var(--line);
  }
  .room-chip{
    font-family:'JetBrains Mono', monospace; font-weight:700; letter-spacing:0.12em;
    background: var(--surface-2); border:1px solid var(--line);
    padding:6px 12px; border-radius:8px; font-size:14px; color: var(--ink);
  }
  .role-chip{
    font-size:11px; text-transform:uppercase; letter-spacing:0.08em;
    padding:6px 10px; border-radius:8px; font-weight:600;
    background: rgba(232,185,89,0.1); color: var(--ink); border:1px solid rgba(232,185,89,0.25);
  }
  .role-chip.viewer{ background: rgba(94,234,212,0.08); color: var(--live); border-color: rgba(94,234,212,0.25); }

  .toolbar .spacer{ flex:1; }

  .icon-btn{
    display:flex; align-items:center; gap:8px;
    padding:9px 14px; border-radius:9px;
    border:1px solid var(--line); background: var(--surface-2); color: var(--text);
    font-size:13px; font-weight:500;
    transition: border-color .15s, background .15s;
  }
  .icon-btn:hover{ border-color: var(--ink-dim); background:#262a35; }
  .icon-btn.primary{ background: var(--ink); color:#1a1406; border-color: var(--ink); font-weight:600; }
  .icon-btn.primary:hover{ background:#f0c470; }
  .icon-btn.ghost{ background:transparent; }

  .panes{
    flex:1; display:grid; grid-template-columns: 1fr 1fr; gap:1px;
    background: var(--line);
    min-height:0;
  }
  .panes.single{ grid-template-columns: 1fr; }
  .pane{
    background: var(--bg); display:flex; flex-direction:column; min-height:0;
  }
  .pane-head{
    padding: 12px 18px 8px; font-size:11px; text-transform:uppercase;
    letter-spacing:0.1em; color:var(--muted); font-weight:600;
    display:flex; align-items:center; justify-content:space-between;
  }
  .pane-head .clear-btn{
    font-size:11px; color:var(--muted); background:none; border:none; text-decoration:underline;
    text-transform:none; letter-spacing:0;
  }
  .pane-head .clear-btn:hover{ color: var(--text); }

  textarea{
    flex:1; resize:none; border:none; outline:none;
    background: transparent; color: var(--text);
    font-family:'Inter', sans-serif; font-size:16px; line-height:1.65;
    padding: 4px 18px 18px; margin:0;
  }
  textarea::placeholder{ color:#4a4e5c; }
  textarea[readonly]{ cursor: default; }

  .canvas-wrap{
    flex:1; position:relative; margin: 0 18px 18px;
    border-radius: 12px; overflow:hidden;
    background: var(--surface);
    border: 1px solid var(--line);
    touch-action: none;
  }
  canvas{ width:100%; height:100%; display:block; touch-action:none; }

  .canvas-overlay{
    position:absolute; top:10px; left:12px; right:12px;
    display:flex; align-items:center; justify-content:space-between;
    pointer-events:none; font-size:11px; color: var(--muted);
  }
  .converting{
    display:flex; align-items:center; gap:6px;
    color: var(--live); opacity:0; transition: opacity .2s;
  }
  .converting.show{ opacity:1; }
  .spinner{
    width:10px; height:10px; border-radius:50%;
    border:2px solid rgba(94,234,212,0.25); border-top-color: var(--live);
    animation: spin .7s linear infinite;
  }
  @keyframes spin{ to{ transform: rotate(360deg); } }

  .viewer-lock{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    flex:1; color: var(--muted); gap:10px; padding: 40px;
  }
  .viewer-lock .glyph{ font-size:22px; color: var(--live); }
  .viewer-lock p{ font-size:13px; margin:0; text-align:center; max-width:260px; }

  @media (max-width: 760px){
    .panes{ grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
    .toolbar{ padding:10px 14px; }
    textarea{ padding:4px 14px 14px; }
    .canvas-wrap{ margin:0 14px 14px; }
  }

  .toast{
    position:fixed; bottom:22px; left:50%; transform: translateX(-50%) translateY(20px);
    background: var(--surface-2); border:1px solid var(--line);
    padding:10px 18px; border-radius:10px; font-size:13px;
    opacity:0; pointer-events:none; transition: all .25s ease;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    z-index: 50;
  }
  .toast.show{ opacity:1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div id="app">

  <div class="topbar">
    <div class="brand">
      <div class="brand-mark"></div>
      <div class="brand-name"><b>Wavelength</b> — live scratchpad</div>
    </div>
    <div class="status-pill" id="statusPill">
      <span class="dot" id="statusDot"></span>
      <span id="statusText">not connected</span>
    </div>
  </div>

  <!-- LANDING -->
  <div class="center-stage" id="landing">
    <div class="tuner-card">
      <div class="eyebrow">Tune in</div>
      <h1>Enter a 4-digit frequency</h1>
      <p class="sub">Both devices join the same code to share one live channel — no accounts, nothing saved on a server.</p>

      <div class="code-row" id="codeRow">
        <input class="code-digit" inputmode="numeric" maxlength="1" data-i="0">
        <input class="code-digit" inputmode="numeric" maxlength="1" data-i="1">
        <input class="code-digit" inputmode="numeric" maxlength="1" data-i="2">
        <input class="code-digit" inputmode="numeric" maxlength="1" data-i="3">
      </div>

      <div class="role-row">
        <button class="role-btn sender" id="joinSender" disabled>
          <div class="role-icon">✎</div>
          <div>
            <div class="role-title">Join as Sender</div>
            <div class="role-desc">Write or sketch — it streams live to the other device</div>
          </div>
        </button>
        <button class="role-btn viewer" id="joinViewer" disabled>
          <div class="role-icon">▣</div>
          <div>
            <div class="role-title">Join as Viewer</div>
            <div class="role-desc">Read-only display, updates as the sender writes</div>
          </div>
        </button>
      </div>

      <div class="hint">Enter all 4 digits to unlock joining</div>
    </div>
  </div>

  <!-- WORKSPACE -->
  <div class="workspace" id="workspace">
    <div class="toolbar">
      <span class="room-chip" id="roomChip">----</span>
      <span class="role-chip" id="roleChip">sender</span>
      <div class="spacer"></div>
      <button class="icon-btn ghost" id="leaveBtn">Leave</button>
      <button class="icon-btn primary" id="saveBtn">Save .txt</button>
    </div>

    <div class="panes" id="panes">
      <div class="pane">
        <div class="pane-head">
          <span>Notes</span>
        </div>
        <textarea id="textArea" placeholder="Start typing… it syncs instantly."></textarea>
      </div>

      <div class="pane" id="canvasPane">
        <div class="pane-head">
          <span>Sketch to text</span>
          <button class="clear-btn" id="clearCanvasBtn">clear canvas</button>
        </div>
        <div class="canvas-wrap">
          <div class="canvas-overlay">
            <span>write a word, pause to convert</span>
            <span class="converting" id="convertingIndicator"><span class="spinner"></span> converting…</span>
          </div>
          <canvas id="inkCanvas"></canvas>
        </div>
      </div>
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  const SUPABASE_URL = "https://ryipuhctmxypjobhrwtf.supabase.co";
  const SUPABASE_KEY = "sb_publishable_0RtUaUd4oOs3pPl-4Q9UIQ_LEw82n6D";
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  let channel = null;
  let roomCode = null;
  let role = null; // 'sender' | 'viewer'
  let applyingRemote = false; // guard to avoid re-broadcast loops

  // ---------- Socket.io realtime server ----------
  const SOCKET_SERVER_URL = "https://tab-tl9u.onrender.com";
  let socket = null;

  function connectSocket(code, deviceType){
    if(socket){
      try{ socket.disconnect(); }catch(e){}
    }

    socket = io(SOCKET_SERVER_URL, {
      transports: ['websocket', 'polling']
    });

    socket.on('connect', () => {
      console.log('[socket] connected:', socket.id);
      socket.emit('join-room', { roomCode: code, deviceType });
    });

    socket.on('disconnect', (reason) => {
      console.log('[socket] disconnected:', reason);
    });

    socket.on('connect_error', (err) => {
      console.error('[socket] connection error:', err.message || err);
    });

    // Incoming data relayed from the other device(s) in the room
    socket.on('receive-payload', (data) => {
      handleIncomingPayload(data);
    });

    // Room membership / status changes (e.g. peer joined/left)
    socket.on('room-updated', (data) => {
      handleRoomUpdate(data);
    });

    return socket;
  }

  function disconnectSocket(){
    if(socket){
      try{ socket.disconnect(); }catch(e){}
      socket = null;
    }
  }

  // Handle incoming text/canvas data from other device
  function handleIncomingPayload(data){
    if(!data) return;
    // Sync text from sender if we're a viewer
    if(data.text !== undefined && role === 'viewer'){
      applyingRemote = true;
      textArea.value = data.text;
      applyingRemote = false;
    }
    // Sync canvas strokes if present
    if(data.canvas && role === 'viewer'){
      drawRemoteStrokes(data.canvas);
    }
  }

  // Handle room status updates
  function handleRoomUpdate(data){
    // Triggered when peers join/leave
    console.log('[room-update]', data);
  }

  // Draw received canvas strokes on viewer
  function drawRemoteStrokes(canvasData){
    if(!canvasData) return;
    ctx.clearRect(0,0,canvas.width,canvas.height);
    for(let stroke of canvasData){
      if(stroke[0].length < 2) continue;
      ctx.beginPath();
      ctx.moveTo(stroke[0][0], stroke[1][0]);
      for(let i=1; i<stroke[0].length; i++){
        ctx.lineTo(stroke[0][i], stroke[1][i]);
      }
      ctx.stroke();
    }
  }

  // Send real-time data to the rest of the room
  function sendPayload(data){
    if(!socket || !socket.connected){
      console.warn('[socket] cannot send payload — not connected');
      return;
    }
    socket.emit('send-payload', {
      roomCode: roomCode,
      ...data
    });
  }

  // Hook: called whenever data arrives from another device in the room.
  // Wire this up to whatever live UI elements need to stay in sync.
  function handleIncomingPayload(data){
    console.log('[socket] receive-payload:', data);
  }

  // Hook: called whenever the server reports a change in room state
  // (e.g. sender/viewer connected or disconnected). Wire this up to
  // your status pill / UI as needed.
  function handleRoomUpdate(data){
    console.log('[socket] room-updated:', data);
  }

  // ---------- DOM refs ----------
  const digits = Array.from(document.querySelectorAll('.code-digit'));
  const joinSenderBtn = document.getElementById('joinSender');
  const joinViewerBtn = document.getElementById('joinViewer');
  const landing = document.getElementById('landing');
  const workspace = document.getElementById('workspace');
  const roomChip = document.getElementById('roomChip');
  const roleChip = document.getElementById('roleChip');
  const statusDot = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');
  const textArea = document.getElementById('textArea');
  const saveBtn = document.getElementById('saveBtn');
  const leaveBtn = document.getElementById('leaveBtn');
  const canvasPane = document.getElementById('canvasPane');
  const panes = document.getElementById('panes');
  const clearCanvasBtn = document.getElementById('clearCanvasBtn');
  const convertingIndicator = document.getElementById('convertingIndicator');
  const canvas = document.getElementById('inkCanvas');
  const ctx = canvas.getContext('2d');
  const toastEl = document.getElementById('toast');

  // ---------- Toast ----------
  let toastTimer = null;
  function toast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=> toastEl.classList.remove('show'), 2200);
  }

  // ---------- Code entry ----------
  digits.forEach((inp, idx)=>{
    inp.addEventListener('input', ()=>{
      inp.value = inp.value.replace(/[^0-9]/g,'').slice(0,1);
      if(inp.value && digits[idx+1]) digits[idx+1].focus();
      checkCodeComplete();
    });
    inp.addEventListener('keydown', (e)=>{
      if(e.key === 'Backspace' && !inp.value && digits[idx-1]){
        digits[idx-1].focus();
      }
    });
    inp.addEventListener('paste', (e)=>{
      const text = (e.clipboardData.getData('text') || '').replace(/[^0-9]/g,'');
      if(text.length){
        e.preventDefault();
        text.slice(0,4).split('').forEach((ch,i)=>{ if(digits[i]) digits[i].value = ch; });
        checkCodeComplete();
        (digits[Math.min(text.length,4)-1] || digits[3]).focus();
      }
    });
  });

  function checkCodeComplete(){
    const complete = digits.every(d => d.value.length === 1);
    joinSenderBtn.disabled = !complete;
    joinViewerBtn.disabled = !complete;
  }

  function getCode(){ return digits.map(d=>d.value).join(''); }

  joinSenderBtn.addEventListener('click', ()=> enterRoom('sender'));
  joinViewerBtn.addEventListener('click', ()=> enterRoom('viewer'));

  // ---------- Room join ----------
  function enterRoom(chosenRole){
    roomCode = getCode();
    role = chosenRole;

    // Connect to the realtime Socket.io server for this room
    connectSocket(roomCode, role);

    landing.style.display = 'none';
    workspace.classList.add('active');
    roomChip.textContent = roomCode;
    roleChip.textContent = role;
    roleChip.classList.toggle('viewer', role === 'viewer');

    if(role === 'viewer'){
      textArea.setAttribute('readonly','true');
      textArea.placeholder = 'Waiting for the sender to write…';
      panes.classList.add('single');
      canvasPane.style.display = 'none';
    } else {
      panes.classList.remove('single');
      canvasPane.style.display = 'flex';
      setTimeout(setupCanvas, 30);
    }

    channel = supabase.channel('room-' + roomCode, {
      config: { broadcast: { self: false } }
    });

    channel.on('broadcast', { event: 'text-update' }, (payload)=>{
      applyingRemote = true;
      textArea.value = payload.payload.text;
      applyingRemote = false;
    });

    channel.subscribe((status)=>{
      if(status === 'SUBSCRIBED'){
        statusDot.classList.add('live');
        statusText.textContent = 'live on ' + roomCode;
      } else if(status === 'CLOSED' || status === 'CHANNEL_ERROR'){
        statusDot.classList.remove('live');
        statusText.textContent = 'disconnected';
      }
    });
  }

  function leaveRoom(){
    disconnectSocket();
    if(channel){ supabase.removeChannel(channel); channel = null; }
    statusDot.classList.remove('live');
    statusText.textContent = 'not connected';
    workspace.classList.remove('active');
    landing.style.display = 'flex';
    textArea.value = '';
    textArea.removeAttribute('readonly');
    textArea.placeholder = 'Start typing… it syncs instantly.';
    digits.forEach(d => d.value = '');
    checkCodeComplete();
    digits[0].focus();
  }
  leaveBtn.addEventListener('click', leaveRoom);

  // ---------- Text broadcast (sender only) ----------
  let textDebounce = null;
  textArea.addEventListener('input', ()=>{
    if(role !== 'sender' || applyingRemote) return;
    clearTimeout(textDebounce);
    textDebounce = setTimeout(()=>{
      if(socket && socket.connected){
        socket.emit('send-payload', { text: textArea.value });
      }
    }, 120); // light debounce so we don't spam on every keystroke
  });

  // ---------- Save as .txt ----------
  saveBtn.addEventListener('click', ()=>{
    const blob = new Blob([textArea.value], { type: 'text/plain' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'scratchpad-' + (roomCode || 'notes') + '.txt';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    toast('Saved as .txt');
  });

  // ---------- Canvas / handwriting ----------
  let strokes = [];       // completed strokes for this pending batch: [[x...],[y...],[t...]]
  let currentStroke = null;
  let drawing = false;
  let inkTimer = null;
  const t0 = Date.now();

  function setupCanvas(){
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    const getPos = (e)=>{
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return { x: clientX - rect.left, y: clientY - rect.top };
    };

    const start = (e)=>{
      e.preventDefault();
      drawing = true;
      clearTimeout(inkTimer);
      convertingIndicator.classList.remove('show');
      const p = getPos(e);
      currentStroke = { x:[p.x], y:[p.y], t:[Date.now()-t0] };
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
    };
    const move = (e)=>{
      if(!drawing) return;
      e.preventDefault();
      const p = getPos(e);
      currentStroke.x.push(p.x);
      currentStroke.y.push(p.y);
      currentStroke.t.push(Date.now()-t0);
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
    };
    const end = (e)=>{
      if(!drawing) return;
      drawing = false;
      if(currentStroke && currentStroke.x.length > 1){
        strokes.push([currentStroke.x, currentStroke.y, currentStroke.t]);
      }
      currentStroke = null;
      scheduleConvert();
    };

    canvas.addEventListener('mousedown', start);
    canvas.addEventListener('mousemove', move);
    window.addEventListener('mouseup', end);
    canvas.addEventListener('touchstart', start, { passive:false });
    canvas.addEventListener('touchmove', move, { passive:false });
    canvas.addEventListener('touchend', end, { passive:false });

    styleStroke();
  }

  function styleStroke(){
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.lineWidth = 3;
    ctx.strokeStyle = '#e8b959';
  }

  function resizeCanvas(){
    const wrap = canvas.parentElement;
    const dpr = window.devicePixelRatio || 1;
    const w = wrap.clientWidth, h = wrap.clientHeight;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
    styleStroke();
  }

  function scheduleConvert(){
    clearTimeout(inkTimer);
    inkTimer = setTimeout(convertInk, 1000);
  }

  clearCanvasBtn.addEventListener('click', ()=>{
    clearTimeout(inkTimer);
    strokes = [];
    ctx.clearRect(0,0,canvas.width,canvas.height);
    convertingIndicator.classList.remove('show');
  });

  async function convertInk(){
    if(strokes.length === 0) return;
    const inkInput = strokes.map(s => [s[0], s[1], s[2]]); // [[x...],[y...],[t...]]
    convertingIndicator.classList.add('show');

    const requestBody = {
      options: 'enable_pre_space',
      requests: [{
        writing_guide: { writing_area_width: Math.round(canvas.clientWidth), writing_area_height: Math.round(canvas.clientHeight) },
        ink: inkInput,
        language: 'en'
      }]
    };

    try{
      const res = await fetch('https://inputtools.google.com/request?itc=en-t-i0-handwrit&app=autotrack', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(requestBody)
      });
      const data = await res.json();
      let topMatch = null;
      if(Array.isArray(data) && data[0] === 'SUCCESS'){
        topMatch = data[1]?.[0]?.[1]?.[0] || null;
      }
      if(topMatch){
        const needsSpace = textArea.value.length > 0 && !/\s$/.test(textArea.value);
        textArea.value += (needsSpace ? ' ' : '') + topMatch;
        if(role === 'sender' && channel){
          channel.send({ type:'broadcast', event:'text-update', payload:{ text: textArea.value } });
        }
      } else {
        toast('No match recognized — try again');
      }
    } catch(err){
      toast('Handwriting service unavailable');
      console.error(err);
    } finally {
      strokes = [];
      ctx.clearRect(0,0,canvas.width,canvas.height);
      convertingIndicator.classList.remove('show');
    }
  }

  // init
  checkCodeComplete();
  digits[0].focus();
})();
</script>
</body>
</html>
